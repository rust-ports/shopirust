[workspace]
resolver = "2"
members = [
    "crates/cli-kit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# rate limiting
governor = "0.6"

# logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# hashing
sha2 = "0.10"
hex = "0.4"

# randomness
rand = "0.8"

# filesystem paths
dirs = "5"

[profile.release]
strip = true
lto = true