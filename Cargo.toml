[workspace]
resolver = "2"
members = [
    "crates/cli-kit",
    "crates/cli-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# rate limiting
governor = "0.6"

# terminal output
colored = "2.2"
console = "0.15"
is-terminal = "0.4"
inquire = "0.9"
indicatif = "0.18"

# TUI engine (Ink-equivalent for Rust)
ratatui = "0.29"
crossterm = "0.28"

# logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# hashing
sha2 = "0.10"
hex = "0.4"

# randomness
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
open = "5"
base64 = "0.22"

# filesystem paths
dirs = "5"

# date/time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = true