[package]
name = "shopirust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Independent Rust CLI compatible with Shopify developer workflows"
keywords = ["shopify", "cli", "commerce", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
default-run = "shopify"

[lib]
name = "cli_kit"

[[bin]]
name = "shopify"
path = "src/main.rs"

[[bin]]
name = "create-app"
path = "src/bin/create-app.rs"

[dependencies]
cli-core = { package = "shopirust-core", version = "=0.1.0-alpha.1", path = "../cli-core" }
cli-api = { package = "shopirust-api", version = "=0.1.0-alpha.1", path = "../cli-api" }
clap = { version = "4", features = ["derive", "env"] }
theme = { package = "shopirust-theme", version = "=0.1.0-alpha.1", path = "../theme" }
app = { package = "shopirust-app", version = "=0.1.0-alpha.1", path = "../app" }
store = { package = "shopirust-store", version = "=0.1.0-alpha.1", path = "../store" }
strsim = "0.11"
async-trait = "0.1"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
dirs.workspace = true
chrono.workspace = true
colored.workspace = true
console.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures = "0.3"
is-terminal.workspace = true
inquire.workspace = true
indicatif.workspace = true
uuid.workspace = true
open.workspace = true
base64.workspace = true
flate2.workspace = true
tar.workspace = true
once_cell = "1"
regex-lite = "0.1"
url.workspace = true

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
sha2.workspace = true
hex.workspace = true
tracing-test = "0.2"
assert_cmd = "2"
predicates = "3"
