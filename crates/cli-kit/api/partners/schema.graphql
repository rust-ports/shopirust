schema {
  query: QueryRoot
  mutation: MutationRoot
}

"""A Partner organization or shop."""
interface Actor {
  """A URL referencing the avatar associated with the actor."""
  avatarUrl: Url

  """
  A globally unique identifier for the actor. Example value: `gid://partners/Shop/1234`.
  """
  id: ID!

  """
  The name of the actor. This might be a Partner organization or shop name.
  """
  name: String!
}

"""A version of the API."""
type ApiVersion {
  """The human-readable name of the version."""
  displayName: String!

  """
  The unique identifier of an ApiVersion. All supported API versions have a date-based (YYYY-MM) or `unstable` handle.
  """
  handle: String!

  """Whether the version is supported by Shopify."""
  supported: Boolean!
}

"""A Shopify [app](/concepts/apps)."""
type App implements Node {
  """A unique application API identifier."""
  apiKey: String!

  """A list of app events."""
  events(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int

    """Returns app events of the specified types."""
    types: [AppEventTypes!]

    """
    Returns app events associated with the specified shop ID. Example value: `gid://partners/Shop/1234`.
    """
    shopId: ID

    """
    Returns app events associated with the specified [app charge](/tutorials/bill-for-your-app-using-graphql-admin-api). Example value: `gid://shopify/AppUsageRecord/1234`.
    """
    chargeId: ID

    """
    Returns app events that occurred on or after the specified date and time.
    """
    occurredAtMin: DateTime

    """
    Returns app events that occurred on or before the specified date and time.
    """
    occurredAtMax: DateTime
  ): AppEventConnection!

  """The ID of the app. Example value: `gid://partners/App/1234`."""
  id: ID!

  """The name of the app."""
  name: String!
}

"""
A [charge](/docs/admin-api/rest/reference/billing/applicationcharge) created through an app.
"""
interface AppCharge {
  """The amount of the app charge."""
  amount: Money!

  """A globally unique identifier."""
  id: ID!

  """The name of the app charge."""
  name: String!

  """Whether the app purchase was a test transaction."""
  test: Boolean!
}

"""
A [credit](/docs/admin-api/rest/reference/billing/applicationcredit) issued
to a merchant for an app. Merchants are entitled to app credits under certain circumstances,
such as when a paid app subscription is downgraded partway through its billing cycle.
"""
type AppCredit implements AppCharge & Node {
  """The amount that can be used towards future app purchases in Shopify."""
  amount: Money!

  """A globally unique identifier."""
  id: ID!

  """The description of the app credit."""
  name: String!

  """Whether the app credit was a test transaction."""
  test: Boolean!
}

"""The result of an appCreditCreate mutation."""
type AppCreditCreatePayload {
  """The app credit that was created."""
  appCredit: AppCredit

  """Errors when creating the application credit."""
  userErrors: [UserError!]
}

"""An event involving an app credit."""
interface AppCreditEvent {
  """
  A [credit](/docs/admin-api/rest/reference/billing/applicationcredit) issued
  to a merchant for an app. Merchants are entitled to app credits under certain circumstances,
  such as when a paid app subscription is downgraded partway through its billing cycle.
  """
  appCredit: AppCredit!
}

"""An event related to a Shopify app."""
interface AppEvent {
  """A Shopify [app](/concepts/apps)."""
  app: App!

  """The date and time when the event took place."""
  occurredAt: DateTime!

  """A Shopify shop."""
  shop: Shop!

  """The type of app event."""
  type: AppEventTypes!
}

"""The connection type for AppEvent."""
type AppEventConnection {
  """A list of edges."""
  edges: [AppEventEdge!]!

  """Information about pagination in a connection."""
  pageInfo: PageInfo!
}

"""An edge in a connection."""
type AppEventEdge {
  """A cursor for use in pagination."""
  cursor: String!

  """The item at the end of the edge."""
  node: AppEvent!
}

"""The type of app event."""
enum AppEventTypes {
  """Relationship installed"""
  RELATIONSHIP_INSTALLED

  """Relationship uninstalled"""
  RELATIONSHIP_UNINSTALLED

  """Relationship reactivated"""
  RELATIONSHIP_REACTIVATED

  """Relationship deactivated"""
  RELATIONSHIP_DEACTIVATED

  """One time charge accepted"""
  ONE_TIME_CHARGE_ACCEPTED

  """One time charge activated"""
  ONE_TIME_CHARGE_ACTIVATED

  """One time charge declined"""
  ONE_TIME_CHARGE_DECLINED

  """One time charge expired"""
  ONE_TIME_CHARGE_EXPIRED

  """Subscription charge accepted"""
  SUBSCRIPTION_CHARGE_ACCEPTED

  """Subscription charge activated"""
  SUBSCRIPTION_CHARGE_ACTIVATED

  """Subscription charge canceled"""
  SUBSCRIPTION_CHARGE_CANCELED

  """Subscription charge declined"""
  SUBSCRIPTION_CHARGE_DECLINED

  """Subscription charge expired"""
  SUBSCRIPTION_CHARGE_EXPIRED

  """Subscription charge frozen"""
  SUBSCRIPTION_CHARGE_FROZEN

  """Subscription charge unfrozen"""
  SUBSCRIPTION_CHARGE_UNFROZEN

  """Subscription capped amount was updated."""
  SUBSCRIPTION_CAPPED_AMOUNT_UPDATED

  """Subscription is approaching capped amount."""
  SUBSCRIPTION_APPROACHING_CAPPED_AMOUNT

  """Credit applied"""
  CREDIT_APPLIED

  """Credit failed"""
  CREDIT_FAILED

  """Credit pending"""
  CREDIT_PENDING

  """Usage charge applied"""
  USAGE_CHARGE_APPLIED
}

"""A transaction corresponding to a one-time app charge."""
type AppOneTimeSale implements Node & Transaction {
  """The app associated with the sale."""
  app: App!

  """
  The ID of the [app charge](/tutorials/bill-for-your-app-using-graphql-admin-api) associated with the transaction. Example value: `gid://shopify/AppUsageRecord/1234`. This value might be `null` for transactions that occurred before September 2020.
  """
  chargeId: ID

  """The date and time when the transaction was recorded."""
  createdAt: DateTime!

  """The total amount that the merchant paid, excluding taxes."""
  grossAmount: Money

  """The transaction ID."""
  id: ID!

  """The net amount that is added to or deducted from your payout."""
  netAmount: Money!

  """The shop associated with the transaction."""
  shop: Shop

  """The amount that Shopify retained from the sale."""
  shopifyFee: Money
}

"""The billing frequency for the app."""
enum AppPricingInterval {
  """The merchant is billed for this app every 30 days."""
  EVERY_30_DAYS

  """The merchant is billed for this app annually."""
  ANNUAL
}

"""
A one-time app charge for services and features purchased once by a store.
For example, a one-time migration of a merchant's data from one platform to another.
"""
type AppPurchaseOneTime implements AppCharge & Node {
  """The amount of the app charge."""
  amount: Money!

  """A globally unique identifier."""
  id: ID!

  """The name of the app charge."""
  name: String!

  """Whether the app purchase was a test transaction."""
  test: Boolean!
}

"""An app event for a one-time app charge."""
interface AppPurchaseOneTimeEvent {
  """
  A one-time app charge for services and features purchased once by a store.
  For example, a one-time migration of a merchant's data from one platform to another.
  """
  charge: AppPurchaseOneTime!
}

